services:
  - type: web
    name: crevio-temp-mail
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SEND_LIMIT_SHARED
        value: 50
      - key: ALLOW_USER_DOMAINS
        value: 1
